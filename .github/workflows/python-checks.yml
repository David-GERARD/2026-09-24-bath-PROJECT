name: Python checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  run-main-and-docstring-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas ruff

      - name: Run main.py
        run: python main.py

      - name: Enforce docstrings with Ruff
        run: ruff check main.py --select D --config "lint.pydocstyle.convention='google'"
